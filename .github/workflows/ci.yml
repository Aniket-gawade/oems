name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile
        run: ./mvnw -B -ntp -DskipTests clean compile

  frontend-verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/oems-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix apps/oems-web

      - name: Frontend lint
        run: npm --prefix apps/oems-web run lint

      - name: Frontend unit tests
        run: npm --prefix apps/oems-web run test:run

      - name: Frontend build
        run: npm --prefix apps/oems-web run build

      - name: Install Playwright Chromium
        run: npm --prefix apps/oems-web run e2e:install

      - name: Frontend visual baseline tests
        run: npm --prefix apps/oems-web run e2e:visual

      - name: Frontend accessibility baseline tests
        run: npm --prefix apps/oems-web run e2e:a11y

      - name: Frontend keyboard navigation baseline tests
        run: npm --prefix apps/oems-web run e2e:keyboard

  unit-tests:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run unit and architecture tests
        run: ./mvnw -B -ntp -Dtest='*Test,*Tests,!*IntegrationTest' test

  integration-tests:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run integration tests
        run: ./mvnw -B -ntp -Dtest='*IntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false -Doems.it.useTestcontainers=false test

      - name: Upload integration test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: '**/surefire-reports/**'
          if-no-files-found: ignore

  package:
    needs:
      - unit-tests
      - integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Package
        run: ./mvnw -B -ntp -DskipTests package

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oems-api-jar
          path: apps/oems-api/target/oems-api-*.jar
          if-no-files-found: error

  dependency-vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run dependency vulnerability scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          vuln-type: library
          ignore-unfixed: true
          format: sarif
          output: trivy-dependency-report.sarif
          severity: HIGH,CRITICAL

      - name: Upload SARIF to GitHub Security
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]')
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-dependency-report.sarif

      - name: Run JSON report export
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          vuln-type: library
          ignore-unfixed: true
          format: json
          output: trivy-dependency-report.json
          severity: HIGH,CRITICAL

      - name: Upload vulnerability report artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dependency-report
          path: trivy-dependency-report.json
          if-no-files-found: error

  frontend-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/oems-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix apps/oems-web

      - name: Generate npm audit report (frontend)
        run: npm audit --prefix apps/oems-web --json > frontend-npm-audit-report.json || true

      - name: Upload frontend npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit-report
          path: frontend-npm-audit-report.json
          if-no-files-found: error

  quality-gate:
    needs:
      - compile
      - frontend-verify
      - unit-tests
      - integration-tests
      - package
      - dependency-vulnerability-scan
      - frontend-dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Final quality gate
        run: echo "All CI stages passed."
