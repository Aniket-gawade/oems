server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/oems?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=oems_user
spring.datasource.password=oems_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/oems
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/oems/protocol/openid-connect/certs
