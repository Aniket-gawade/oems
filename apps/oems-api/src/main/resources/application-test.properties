server.port=0

spring.datasource.url=jdbc:h2:mem:oems_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=1

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:18081/realms/oems
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:18081/realms/oems/protocol/openid-connect/certs

oems.security.jwt.expected-audience=oems-api
oems.security.cors.allowed-origins=http://localhost:3000
oems.security.mock-auth.enabled=false

oems.idempotency.redis-cache-enabled=false

management.health.redis.enabled=false
management.metrics.binders.redis.enabled=false
