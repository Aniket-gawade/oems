spring.application.name=oems-api
spring.profiles.default=local
spring.banner.location=classpath:banner.txt

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.distribution.percentiles.oems.orders.place.latency=0.95
management.metrics.distribution.percentiles-histogram.oems.orders.place.latency=true

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [profile=${spring.profiles.active:default}] [traceId=%X{traceId:-}] [traderId=%X{traderId:-}] %logger{36} - %msg%n

oems.idempotency.ttl=PT24H
oems.idempotency.redis-cache-enabled=false
oems.idempotency.redis-key-prefix=oems:idempotency:
oems.idempotency.cleanup-interval-ms=600000
