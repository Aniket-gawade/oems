services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: oems-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u${MYSQL_USER} -p${MYSQL_PASSWORD} --silent
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:8.6}
    container_name: oems-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.5}
    container_name: oems-keycloak
    restart: unless-stopped
    command: [ "start-dev", "--http-port=8080", "--health-enabled=true", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./ops/keycloak/oems-realm-export.json:/opt/keycloak/data/import/oems-realm-export.json:ro

  prometheus:
    image: prom/prometheus:v3.7.2
    container_name: oems-prometheus
    restart: unless-stopped
    profiles: [ "observability" ]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.2
    container_name: oems-grafana
    restart: unless-stopped
    profiles: [ "observability" ]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

  oems-api:
    container_name: oems-api
    profiles: [ "web" ]
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: staging
      OEMS_SECURITY_CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5173}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/oems?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/oems
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/oems/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
      - keycloak

  oems-web:
    container_name: oems-web
    profiles: [ "web" ]
    restart: unless-stopped
    build:
      context: ./apps/oems-web
      target: dev
    environment:
      WEB_PORT: ${WEB_PORT:-5173}
      VITE_PROXY_TARGET: ${WEB_API_PROXY_TARGET:-http://oems-api:8080}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - oems-api

volumes:
  mysql-data:
  redis-data:
  keycloak-data:
  prometheus-data:
  grafana-data:
