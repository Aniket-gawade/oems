spring.application.name=reference-data-service
server.port=8085
management.endpoints.web.exposure.include=health,info,prometheus

spring.datasource.url=jdbc:mysql://localhost:3306/reference_data_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=oems
spring.datasource.password=oems

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
